# config.yaml로 복사한 뒤 실제 값으로 채우세요. config.yaml은 PC별 로컬 파일이며 git에 커밋되지 않습니다.
# path는 '~' 확장만 지원합니다 (Path(path).expanduser().resolve()). ${VAR} 치환은 지원하지 않습니다.
# 필요해지면 소스에 path_env(환경변수 이름)를 추가할 수 있습니다 — 있으면 그 값이 path보다 우선합니다.
# 경로가 없거나 존재하지 않는 소스는 앱을 죽이지 않고 그 소스만 비활성화(경고 표시)됩니다.

sources:
  # AI 어시스턴트 메모리 — 경로 자동 탐지 (path 불필요)
  - id: claude-memory
    type: claude_memory
    writable: false

  - id: codex-memory
    type: codex_memory
    writable: false

  # Obsidian 볼트 — 유일한 쓰기 대상 (note_target)
  - id: obsidian-notes
    type: markdown
    path: "~/Documents/ObsidianVault"
    writable: true

  # git 저장소는 저장소 단위로 개별 등록 (git ls-files/.gitignore가 정확히 적용됨)
  - id: project-x-git
    type: git_project
    path: "~/Desktop/Projects/project-x-git"
    writable: false

  - id: project-b-api-one
    type: git_project
    path: "~/Desktop/Projects/ProjectB/ApiOne"
    writable: false

  - id: project-b-api-two
    type: git_project
    path: "~/Desktop/Projects/ProjectB/ApiTwo"
    writable: false

  - id: project-b-frontend
    type: git_project
    path: "~/Desktop/Projects/ProjectB/FrontEnd"
    writable: false

  - id: project-b-collector
    type: git_project
    path: "~/Desktop/Projects/ProjectB/Collector"
    writable: false

  - id: project-c-backend
    type: git_project
    path: "~/Desktop/Projects/ProjectC/BackEnd"
    writable: false

  - id: project-c-frontend
    type: git_project
    path: "~/Desktop/Projects/ProjectC/FrontEnd"
    writable: false

  - id: project-c-gateway
    type: git_project
    path: "~/Desktop/Projects/ProjectC/Gateway"
    writable: false

  # git 저장소가 아닌 폴더는 files 타입으로 등록 (확장자 allowlist로 스캔)
  - id: core-docs
    type: files
    path: "~/Desktop/Projects/Core"
    writable: false

# 메모(Save Note)는 이 source id에만 저장됨
note_target: obsidian-notes

ollama:
  host: "http://127.0.0.1:11434"   # loopback만 허용 (강제 검증됨)
  chat_model: "qwen3:4b"
  embed_model: "embeddinggemma"     # 실제 한국어 노트로 비교 후 확정 권장

# 벡터 인덱스/매니페스트 저장 위치 — 반드시 모든 소스 경로 밖
index_path: "./.rag_index"

# 검색 파라미터
top_k: 5
min_similarity: 0.3          # 이 값 미만이면 "로컬 자료에서 근거를 찾지 못했습니다" 응답

# 청킹 파라미터
chunk_size_chars: 1200        # 노트/텍스트용
chunk_overlap_chars: 150
lines_per_chunk: 80           # 소스코드/구조화 파일용
overlap_lines: 10

# 청킹/인덱싱 로직 버전 — 이 값이 바뀌면 전체 재구축
chunk_version: 1

# Save Note 기본 저장 하위 폴더 (obsidian-notes 기준 상대경로)
default_note_folder: "Inbox"
